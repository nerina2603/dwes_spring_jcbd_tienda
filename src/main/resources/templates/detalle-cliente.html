<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-4">
        <div class="row g-3">
            <div class="col-12 border-bottom pb-3">
                <h1 class="h2">Detalle del cliente</h1>
            </div>
            <div class="col-12 col-md-6"><strong>ID</strong>
                <div th:text="${cliente.id}"></div>
            </div>
            <div class="col-12 col-md-6"><strong>Nombre</strong>
                <div th:text="${cliente.nombre}"></div>
            </div>
            <div class="col-12 col-md-6"><strong>Primer apellido</strong>
                <div th:text="${cliente.apellido1}"></div>
            </div>
            <div class="col-12 col-md-6"><strong>Segundo apellido</strong>
                <div th:text="${cliente.apellido2}"></div>
            </div>
            <div class="col-12 col-md-6"><strong>Ciudad</strong>
                <div th:text="${cliente.ciudad}"></div>
            </div>
            <div class="col-12 col-md-6"><strong>Categoría</strong>
                <div th:text="${cliente.categoria}"></div>
            </div>
            <div class="col-12"><a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver</a></div>
        </div>
    </main>
</body>

</html>
